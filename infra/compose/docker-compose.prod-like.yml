services:
  harness:
    profiles: [prod-like]
    environment:
      HARNESS_DATA_DIR: /var/lib/harness/event-store
      HARNESS_VAULT_DATA_DIR: /var/lib/harness/vault
      SANDBOX_RUNNER_TOKEN: null
      SANDBOX_RUNNER_TOKEN_FILE: /run/secrets/sandbox_runner_token
    volumes:
      - harness-event-store:/var/lib/harness/event-store
      - harness-vault:/var/lib/harness/vault
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM
    cpus: 2
    mem_limit: 1g
  sandbox-runner:
    profiles: [prod-like]
    environment:
      SANDBOX_RUNNER_TOKEN: null
      SANDBOX_RUNNER_TOKEN_FILE: /run/secrets/sandbox_runner_token
    secrets:
      - sandbox_runner_token
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM
  otel-collector:
    profiles: [prod-like]
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM
    cpus: 1
    mem_limit: 512m
  presidio-analyzer:
    profiles: [prod-like]
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM
    cpus: 2
    mem_limit: 2g
volumes:
  harness-event-store: {}
  harness-vault: {}
secrets:
  sandbox_runner_token:
    file: ${SANDBOX_RUNNER_TOKEN_SECRET_FILE:-/dev/null}
